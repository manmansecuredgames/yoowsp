<script>
async function initBattery() {
if (!navigator.getBattery) {
document.getElementById("batteryText").textContent = "N/A";
return;
}

const battery = await navigator.getBattery();

function update() {
const level = Math.round(battery.level * 100);
document.getElementById("batteryText").textContent = level + "%";
const fill = document.getElementById("batteryLevel");
fill.setAttribute("width", (level / 100) * 16.57);
}

update();
battery.addEventListener("levelchange", update);
battery.addEventListener("chargingchange", update);
}

initBattery();
</script>

<style>
#fps-counter{
position: fixed;
top: 35px;
right: 15px;
display: flex;
align-items: center;
gap: 6px;
color: white;
font-family: sans-serif;
font-size: 14px;

</style>

<script>
function fps() {
(() => {
const fpsCounter = document.getElementById("fps-counter");
let frames = 0;
let lastTime = performance.now();

function loop(now) {
frames++;
if (now >= lastTime + 1000) {
const fps = Math.round((frames * 1000) / (now - lastTime));
fpsCounter.textContent = `FPS: ${fps}`;
frames = 0;
lastTime = now;
}
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
}
fps();
</script>

<script>
async function loadSplash() {
const splashEl = document.getElementById("splash");
const time = new Date().getHours();

const randomSentences = await fetch("splash.json")
.then(r => r.json());

let splash = "";

if (Math.random() < 0.5) {
const randomIndex = Math.floor(Math.random() * randomSentences.length);
splash = randomSentences[randomIndex];
} else {
if (time < 6) splash = "A bit late?";
else if (time < 12) splash = "Good morning!";
else if (time < 18) splash = "Ready to play?";
else splash = "Still playing?";
}

splashEl.innerHTML = splash;
}

loadSplash();

function showToast(text) {
const toast = document.getElementById("customToast");
toast.innerText = text;
toast.style.display = "block";
setTimeout(() => {
toast.style.display = "none";
}, 2500);
}

function bookmarkSite() {
const key = navigator.userAgent.toLowerCase().indexOf('mac') != -1 ? 'Cmd' : 'Ctrl';
showToast("Press " + key + "+D to bookmark this page.");
}

function toggleModal(show) {
document.getElementById("linksModal").style.display = show ? "flex" : "none";
}

function copyLink(text, btnElement) {
navigator.clipboard.writeText(text).then(() => {
const originalText = btnElement.innerText;
btnElement.innerText = "Copied to clipboard!";
btnElement.style.background = "#28a745";
setTimeout(() => {
btnElement.innerText = originalText;
btnElement.style.background = "#333";
}, 1500);
}).catch(err => {
console.error("Could not copy text: ", err);
});
}

function handleSearch(e) {
if (e.key === "Enter") {
executeAboutBlankSearch();
}
}

function executeAboutBlankSearch() {
const query = document.getElementById("search").value.trim();
if (!query) return;

let targetUrl = query;
if (!query.startsWith("http://") && !query.startsWith("https://")) {
if (query.includes(".") && !query.includes(" ")) {
targetUrl = "https://" + query;
} else {
targetUrl = "https://www.google.com/search?q=" + encodeURIComponent(query);
}
}

const win = window.open("about:blank", "_blank");
if (win) {
win.document.body.style.margin = "0";
win.document.body.style.height = "100vh";
const iframe = win.document.createElement("iframe");
iframe.style.border = "none";
iframe.style.width = "100%";
iframe.style.height = "100%";
iframe.style.margin = "0";
iframe.src = targetUrl;
win.document.body.appendChild(iframe);
} else {
showToast("Please allow pop-ups to open in about:blank.");
}
}
</script>

<script>
function loadUsername() {
const username = localStorage.getItem('username');
const el = document.getElementById('username');
if (el && username) {
el.textContent = username;
}
}

document.addEventListener('DOMContentLoaded', loadUsername);

const buttons = document.querySelectorAll(".menu-btn");
buttons.forEach(button => {
button.addEventListener("click", () => {
document.querySelector(".menu-btn.active")?.classList.remove("active");
button.classList.add("active");
});
});

document.querySelectorAll("button").forEach(btn=>{
if(btn.textContent.trim()==="open"||btn.textContent.trim()==="try 8os" ||btn.textContent.trim()==="try coreus" ||btn.textContent.trim()==="try UBGdir"){
btn.style.width="120px"
}
});

const placeholder="https://pgis.x10.mx/placeholder.png";

document.querySelectorAll("img").forEach(img=>{
img.addEventListener("error",function(){
if(this.src!==placeholder){
this.src=placeholder
}
})

if(!img.getAttribute("src")){
img.src=placeholder
}
});

const games = document.getElementById("games");

const observer = new MutationObserver((mutations) => {
for (const mutation of mutations) {
for (const node of mutation.addedNodes) {
if (node.nodeType !== 1) continue;

const targets = node.querySelectorAll
? [node, ...node.querySelectorAll(".gamediv")]
: [node];

for (const el of targets) {
if (!el.classList || !el.classList.contains("gamediv")) continue;

el.classList.add("game-item");

requestAnimationFrame(() => {
el.classList.add("show");
});
}
}
}
});

observer.observe(document.getElementById("games"), {
childList: true,
subtree: true
});
</script>
